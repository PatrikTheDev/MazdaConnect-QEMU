name: mazda-qemu-software
services:
  lab:
    image: mazda-qemu-software:local
    build:
      context: .
      dockerfile: docker/Software.Dockerfile
    init: true
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - ./artifacts:/workspace/artifacts
      - ./runs:/workspace/runs
      - reference:/lab:ro
      - software-data:/software
    ports:
      - "127.0.0.1:5901:5900"
volumes:
  reference:
    external: true
    name: ${MAZDA_REFERENCE_VOLUME:-mazda-qemu_lab-data}
  software-data:
    name: ${MAZDA_SOFTWARE_VOLUME:-mazda-qemu-software_software-data}
