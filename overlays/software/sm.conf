<?xml version="1.0" encoding="UTF-8"?>
<sm_config>
  <sm_server sched_policy="SCHED_OTHER" sched_priority="0" watchdog_enable="false"/>
  <connect start_timeout="5003" stop_timeout="5004" client_port_number="9091" service_launcher_path="/jci/sm/sm_svclauncher" service_launcher_port_number="9090"/>
  <ping_interval>10000</ping_interval>
  <system_save_timeout>55000</system_save_timeout>
  <reports enable="false" export_dir_path="/data"/>
  <services type="jci_service" reset_board="no" retry_count="0" sched_policy="SCHED_OTHER" sched_priority="0" autorun="yes" affinity_mask="0x01" ping_timeout="8000" start_timeout="45000" stop_timeout="5002" save_at_shutdown="no" user_account="cmu">
    <service name="settings" path="/jci/settings/svc-com-jci-cpp-settings.so" args="--uri=server:// --proxy=tcpip://"/>
    <service name="jciBLMSettings" path="/jci/settings/svcjciblmsettings.so" args="">
      <dependency type="service" value="settings"/>
    </service>
    <service name="jciDbapi" path="/jci/dbapi/svcjcidbapi.so" args=""/>
    <service name="jciAppsdk" path="/jci/appsdk/svcjciappsdk.so" args=""/>
    <service name="system_mazda_my14" path="/jci/system/svcjciblmsystem.so" args="--lvds_timeout=1000 --audio_timeout=5000 --tau_timeout=5000 --save_timeout=60000 --hub_type=1"/>
    <service name="jciVBS" path="/jci/vbs/svcjcivbs.so" args="">
      <dependency type="service" value="settings"/>
    </service>
    <service name="jciMMUI" path="/jci/mmui/svcjcimmui.so" args="mouse=event1, keyboard=event2, display=event1">
      <dependency type="service" value="jciBLMSettings"/>
    </service>
    <service type="process" name="tranlogo" path="/usr/bin/splashplayer" autorun="no" ready_flag="/var/run/tranlogo_ready_flag" exit_allowed="yes" started_after_exit_allowed="no" args="-q -p /var/run/tranlogo_ready_flag -t TRANLOGO_SURFACE -z 700 /jci/resources/TranLogo.ivf">
      <dependency type="service" value="jciMMUI"/>
    </service>
    <service type="process" name="quicktranlogo" path="/usr/bin/splashplayer" autorun="no" ready_flag="/var/run/quicktranlogo_ready_flag" exit_allowed="yes" started_after_exit_allowed="no" args="-l -p /var/run/quicktranlogo_ready_flag -t QUICKTRANLOGO_SURFACE -z 700 /jci/resources/LoopLogo.ivf">
      <dependency type="service" value="jciMMUI"/>
    </service>
    <service type="process" name="exitlogo" path="/usr/bin/splashplayer" autorun="no" ready_flag="/var/run/exitlogo_ready_flag" exit_allowed="yes" started_after_exit_allowed="no" args="-q -p /var/run/exitlogo_ready_flag -t EXITLOGO_SURFACE -z 800 /jci/resources/ExitLogo.ivf">
      <dependency type="service" value="jciMMUI"/>
    </service>
  </services>
</sm_config>
