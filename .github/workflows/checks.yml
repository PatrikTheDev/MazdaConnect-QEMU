name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  firmware-free:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just
      - name: Build pinned reference tooling
        run: just tools reference
      - name: Check source, archive handling, shells and QEMU
        run: just test
