name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  firmware-free:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just
      - name: Build pinned reference tooling
        run: just tools reference
      - name: Check source, archive handling, shells and QEMU
        run: just test
