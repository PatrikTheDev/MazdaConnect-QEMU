name: mazda-qemu
services:
  lab:
    image: mazda-qemu-lab:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    init: true
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - ./artifacts:/workspace/artifacts
      - ./runs:/workspace/runs
      - lab-data:/lab
    ports:
      - "127.0.0.1:5900:5900"
      - "127.0.0.1:1234:1234"
    environment:
      FIRMWARE_ZIP_PASSWORD: ${FIRMWARE_ZIP_PASSWORD:-}
volumes:
  lab-data:
    name: ${MAZDA_REFERENCE_VOLUME:-mazda-qemu_lab-data}
